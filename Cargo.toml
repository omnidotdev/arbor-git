[package]
name = "arbor-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["Omni <team@omni.dev>"]
description = "High-performance Git backend service for Arbor"
license = "MIT"
repository = "https://github.com/omnidotdev/arbor-git"
homepage = "https://arbor.omni.dev"
keywords = ["git", "gitoxide", "grpc", "backend"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"

# HTTP server (for Git Smart HTTP protocol)
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# Git - gitoxide
gix = { version = "0.70", features = ["blocking-http-transport-reqwest-rust-tls"] }
gix-hash = "0.16"
gix-object = "0.48"
gix-pack = "0.57"
gix-protocol = "0.49"
gix-transport = "0.46"
gix-ref = "0.51"
gix-traverse = "0.46"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (for repository metadata)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }

# Streaming
tokio-stream = "0.1"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
async-stream = "0.3"

# Config
dotenvy = "0.15"

# Pin transitive dependency to version compatible with Rust 1.84
home = "0.5.9"

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "arbor-git"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# Allow common pedantic lints that are too strict for this codebase
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_field_names = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
self_only_used_in_recursion = "allow"
unnecessary_wraps = "allow"
